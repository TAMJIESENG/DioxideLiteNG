<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="mock.css">
<style>
  body { width: 1000px; height: 640px; }
  .scene { padding: 0; }
</style>
</head>
<body>
<div class="scene">
  <div class="grid"></div>
  <div class="solo wide">
    <div class="gui">
      <div class="bar"><i></i><i></i><i></i><span class="title">CLICKGUI / COMBAT</span><span class="chip">OPAI · LAVENDER</span></div>
      <div class="body">
        <div class="rail">
          <i class="on">C</i><i>M</i><i>P</i><i>X</i><i>V</i>
        </div>
        <div class="list">
          <div class="row on"><span class="dot"></span>KillAura2<span class="tg"></span></div>
          <div class="row on"><span class="dot"></span>AimAssist<span class="tg"></span></div>
          <div class="row"><span class="dot"></span>AntiBot2<span class="tg"></span></div>
          <div class="row on"><span class="dot"></span>AutoClicker<span class="tg"></span></div>
          <div class="row on"><span class="dot"></span>Velocity2<span class="tg"></span></div>
          <div class="row"><span class="dot"></span>Backtrack2<span class="tg"></span></div>
          <div class="row on"><span class="dot"></span>Criticals2<span class="tg"></span></div>
          <div class="row"><span class="dot"></span>Reach<span class="tg"></span></div>
          <div class="row on"><span class="dot"></span>AutoTotem<span class="tg"></span></div>
          <div class="row"><span class="dot"></span>AutoRod<span class="tg"></span></div>
          <div class="row on"><span class="dot"></span>TargetStrafe<span class="tg"></span></div>
        </div>
        <div class="detail">
          <h4>KILLAURA2</h4>
          <div class="field">
            <label>Target Range <span>3.0</span></label>
            <div class="slider" style="--v:56%"></div>
          </div>
          <div class="field">
            <label>Max CPS <span>14</span></label>
            <div class="slider" style="--v:70%"></div>
          </div>
          <div class="field">
            <label>Target Mode</label>
            <div class="mode"><b class="on">Single</b><b>Multi</b></div>
          </div>
          <div class="field">
            <label>APS Mode</label>
            <div class="mode"><b>Cooldown</b><b class="on">Random CPS</b><b>No Delay</b></div>
          </div>
          <div class="field">
            <label>Swing Order</label>
            <div class="mode"><b>1.8</b><b class="on">1.9.x</b><b>No Order</b></div>
          </div>
          <div class="toggles">
            <div class="tg on">Auto Block<i></i></div>
            <div class="tg on">No Hit Check<i></i></div>
            <div class="tg on">Visual Swing<i></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">MOCKUP · 按 OpaiStyle.LAVENDER 色值与实际设置项重绘</div>
</div>
</body>
</html>
